body:
  text: 唐天竺三藏菩提流志譯如是我聞一時薄伽梵在菩提樹下成正覺處大制多中與大苾芻衆千二百五十人俱其名曰具壽舍利子具壽大目揵連具壽阿難陀如是大聲聞等而為上首及與諸大菩薩衆俱其名曰金剛幢菩薩金剛藏菩薩金剛手菩薩慈氏菩薩如是等於賢劫中一切菩薩摩訶薩衆而為上首爾時金剛手菩薩摩訶薩白佛言世尊唯願如來應正等覺為諸有情說擁護壽命微妙法門由此法門與一切有情作大光明作大覆護令彼有情得無所畏一切怨讎諸惡知識若天若龍若藥叉若羅剎若部多鬼及鳩畔茶人非人等彼終不能起於惡心而為嬈亂奪其精氣若遇刀劍飲食毒藥厭禱諸患不能為害若有衆生行住坐臥睡眠惛醉及以醒覺於一切處我能守護唯願世尊利益一切諸有情故演說如是種種神呪如我常時於如來所親近承事恆不捨離我今守護一切有情亦復如是於一切時為義利故為安樂故為饒益故是故我今勸請如來擁護一切諸善男子善女人住菩薩乘者勿令鬪諍罵辱毀訾心懷怨結及諸病苦非時夭橫金剛手菩薩摩訶薩如是請已時薄伽梵告金剛手菩薩言善哉善哉善男子汝為利益諸有情故勸請如來汝今諦聽善思念之我今為汝演說護命法門名為善門怛姪徒也反下皆同他塢俱一莽莫補反下皆同俱二塢俱摩比卑旨反尼三畔柁儞平聲呼下皆同自此已下字注平上去入者皆依平上去入聲呼之四婆上羅者麼儞平五婆上虎梨婆上虎梨六𭢟乃可反虎七虎虎梨八跋䫂丁可反耶藥何反下皆同九莎去聲呼之下皆同訶十爾時如來說此灌頂陀羅尼呪已於是世尊復說諸佛之所護念陀羅尼呪長壽法門怛姪他跋折常逸反下皆同𠼝自此已下口邊作字者皆轉舌呼之跋折𠼝跋折𠼝一跋折囉柁嚟二跋折囉婆上底丁履反下皆同三跋折囉蘗底四跋折囉柁啼田脂反下皆同五斫訖囉跋折𠼝六斫訖囉柁𠼝七麼𠼝八柁𠼝柁𠼝九鼻𠼝鼻𠼝十莽𠼝質𠼝十一虎虎𠼝十二朋去伽鼻鼻𠼝十三始𠼝十四𠼝𠼝尸十五主主𠼝十六嚕嚕旨十七婆上𠼝者之可反下皆同犁十八主𠼝莽𠼝者𠼝十九曼茶上聲下皆同𠼝二十曼茶儞二十一薩婆播跋鼻那捨尸可反下皆同儞二十二薩婆嚕伽鉢囉奢末儞二十三阿迦羅蜜哩柱丁庾反下皆同鉢囉底鎩柁儞二十四夜藥箇反下皆同婆柱婆思訖反下皆同婆上奔入那奔入𡆆底鎩柁儞二十五怛姪他曼茶儞一伽伽囉尼二謨茶儞三三鉢𡆆謨茶儞四那捨尸可反下皆同儞五三鉢羅那捨儞六薩婆毗蒲也反啼鉢𡆆捨末儞七夜藥可反婆杜娑思訖反婆上奔入那阿迦羅蜜哩柱鉢𡆆底鎩柁儞八怛姪他那捨儞一那捨儞二畔柁儞畔柁儞三瞋去聲呼下同陀瞋陀四鼻𠼝弭𠼝五娑上𠼝六訶怛泥七跋𠼝八婆上聲下皆同𠼝婆𠼝九毗上啼十毗上𠼝毗上𠼝毗上𠼝十一烏沙師可反𠼝十二奢𡆆泥十三婆上𡆆婆嚕泥十四婆𡆆迦茶曳十五婆𡆆𠿒訶訖反摩遮哩尼十六因達羅婆上底十七地地囉野尼十八納慕莫醯濕筏囉囉曳儞十九紇唎師婆社禰二十播跛闍時何反㰤呼可反儞二十一迦去羅婆地儞二十二部多婆地儞二十三薩多丁耶反羯挮二十四素摩跋低二十五素摩奔入𡆆鞞二十六莎訶二十七但姪他𠿒如字下皆同囉𠿒囉一呬虛利反下皆同犁二莎訶三怛姪他揭雉多一鉢雉多二阿曳那三阿𠼝蟾跋泥四翳迦羯柁泥五補多多訖反囉茶𠿒儞六末伽長聲呼毗盧𠿒儞七虎娑跋底八虎娑跋底九補娑跋底十補娑跋底十一呬梨呬梨十二也他長聲下同闍時箇反耶十三也他阿耆耆逸反儞十四也他鉢嚂者十五也他跋監十六也他跋折嚂十七也他訶哩訶訖反柁監十八佛告金剛手菩薩摩訶薩此護命善門陀羅尼神呪過去如來應正等覺先所演說先已守護發大誓願真實建立我今亦為利益悲愍一切有情發大誓願真實建立是故說此陀羅尼呪爾時薄伽梵放大人相眉間光明其光普曜諸佛剎土由佛神變諸剎土中一切如來見此光明各從自土俱時發趣索訶世界到釋迦牟尼佛所讚言善哉善哉釋迦牟尼佛乃能利益擁護一切諸有情故說此法門陀羅尼呪能作光明令得歡喜令得正念是故我今稱揚讚歎若有善男子善女人於晨朝時受持讀誦此陀羅尼神呪句義當獲二十種功德一者當得諸佛之所攝受二者常為諸佛之所憶念三者當得永離受惡趣業四者當得長壽富貴五者當得名稱遠聞六者當得勇猛威力七者恆常無病復能精進八者常為諸佛之所覆護九者復為諸天之所憶念十者勤修善行十一者當得光明歡喜正念十二者當得諸相具足十三者得無所畏十四者當得具足尸羅十五者當得成就一切善根十六者當得諸天守護十七者當得諸龍守護十八者當得藥叉守護十九者當得一切世間之所敬愛二十者速疾得阿耨多羅三藐三菩提佛告金剛手我今說此陀羅尼呪即是諸佛如來應正等覺祕密之處一切諸佛之所守護爾時金剛手菩薩摩訶薩白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼若復有人能受持此護命法門陀羅尼呪於晨朝時當起讀誦世尊我常守護如是等人令無惱害怛姪他尸弃平聲呼之下同尸弃尸弃尸弃一旨旨旨旨二婆婆婆婆三鶻嚕嚕嚕嚕四恃恃恃恃五䞘其乞反囉䞘囉䞘囉䞘囉六欯許日反𠼝欯𠼝欯𠼝欯𠼝七㰤呼可反㰤㰤㰤八麼麼麼麼九末那末那十㰤那㰤迷十一薩婆鉢喇多丁也反㗚體他旨反迦十二柁訶柁訶謎十三薩婆設怛喇婆十四鉢遮鉢遮謎十五薩婆阿呬帶史拏十六莎訶十七爾時薄伽梵讚金剛手菩薩摩訶薩言善哉善哉善男子汝今說此陀羅尼神呪成就最勝有大義利我為覆護諸有情故於彼一切毛孔之中施其威光令得安樂爾時索訶世界主梵天王即從座起向佛合掌恭敬而白佛言世尊我今亦為利益守護諸善男子及善女人說陀羅尼神呪怛姪他呬𠼝一弭梨二旨梨三莎訶四勃𡆆黑訶訖反下同摩補𠼝五莎訶六勃𡆆黑摩娑思訖反嚩𠼐七莎訶八勃𡆆黑摩薜九蘇揭薜十補澀波僧娑思訖反䫂𠼐十一莎訶十二世尊此神呪句欲為擁護利益諸善男子及善女人於晨朝時當起讀誦爾時天帝釋白佛言世尊我今亦為擁護利益諸善男子及善女人唯願如來垂哀護念當說陀羅尼若復有人能受持此護命善門於晨朝時憶念讀誦怛姪他毗儞平婆𡆆尼一憚茶摩茶徒皆反二旨胝胝儞平三具𠼝乾陀𠼝四薩𡆆麼訶儞平跋折㘕五多嚕尼六駐吒故反羅摩履儞平七斫訖囉婆上雞吉夷反八捨婆上𠼐九捨麼𠼐十鉢囉摩攞低十一㰤那摩蚶陀鹽反多𡆆尼十二苫跋𠼝十三莎訶十四爾時多聞天王持國天王增長天王醜目天王合掌恭敬白佛言世尊我等亦為擁護利益諸善男子及善女人說陀羅尼神呪若復有人能受持此護命法門於晨朝時當起讀誦怛姪他補澀篦比奚反一蘇補澀篦二杜摩跛𠼝訶𠼐三阿㗚耶鉢𡆆捨悉低四扇低五儞㗚目訖低六瞢伽上例平七呬囉尼尼也反揭鞞八窣堵低九娑思訖反多鼻低十莎訶十一爾時鬼子母訶履底丁履反白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼若復有人能受持此護命神呪善門陀羅尼於晨朝時當起讀誦怛姪他悉梨一斯悉梨二悉梨三斯悉梨四必梨五摩訶卑必梨六悉弭履斯七堀嚕泥尼皆反八下皆同堀嚕泥九堀嚕泥十摩訶堀嚕泥普十一莎訶十二爾時五大山藥叉軍將合掌恭敬白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼神呪若復有人能受持此護命神呪法門陀羅尼於晨朝時當起讀誦怛姪他遏𪘜卓皆反普一跋𪘜普二橠𪘜普三矩𭢟𪘜普四摩𭢟𪘜普五曷囉門上茶㰤低普六室𠼝普七朋去祁祁奚反普八麼者犁普九莎訶十爾時金剛手菩薩摩訶薩白佛言世尊我今亦為擁護利益諸善男子善女人故悲愍攝受皆令安隱致諸吉祥我當結界令離刀杖銷諸惡毒若復有人能受持此護命法門於晨朝時當起讀誦怛姪他𠿒訶訖反下同𭌆跋折𠼐一𠿒𭌆跋折𠼐二呬呬呬呬三鼻四鼻私五麼訶鼻私普六莎訶七爾時大自在天子合掌恭敬白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼神呪若復有人能受持此護命善門於晨朝時當起讀誦怛姪他虎盧虎盧虎盧虎盧一魯魯魯魯魯魯二薩婆部多奔入𡆆底丁履反下同鎩柁南迦𡀔弭三莎訶四爾時童子軍將向佛合掌恭敬而立白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼若復有人能受持此護命神呪陀羅尼法門於晨朝時清潔其身當起讀誦怛姪他呬梨一呬梨二呬梨三梨四梨五梨六梨七梨八梨九薩婆部多奔入囉底鎩拖南迦路弭十莎訶十一爾時月光天子合掌恭敬白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼若復有人能受持此護命法門陀羅尼神呪於晨朝時當起讀誦怛姪他應烏蹬反耆耆西反下同一朋去耆二障耆三呬儞平四地地五地地六旨旨普七莎訶八爾時聖觀自在菩薩摩訶薩白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼若復有人能受持此護命法門於晨朝時當起讀誦怛姪他㰤低一毗㰤低二儞平㰤低三蘇㰤低四薩婆奔入𡆆多丁耶反㗚體他旨反雞五奔入𡆆多丁耶反弭怛𠼝六輸上提七目訖低八毗麼梨九涅乃逸反麼犁十奔入𡆆婆娑思訖反嚩𠼐十一奔入𡆆婆娑思訖反迦上𠼝十二奔入囉婆迦上𠼐普十三莎訶十四爾時慈氏菩薩白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼若復有人能受持此護命法門於晨朝時當起讀誦怛姪他十筏犁一十筏犁二摩訶十筏犁三十筏犁四十筏履儞平五塢訖低六目訖低七閃謎八奔入𡆆閃謎九摩訶閃謎十閃弭十一三摩提十二摩訶三摩提十三三摩鉢低十四摩訶三摩鉢低十五十筏犁十六摩訶十筏犁十七十筏㘕婆謎普十八莎訶十九爾時雪山大藥叉軍將合掌恭敬而白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼神呪若復有人能受持此護命法門於晨朝時當起讀誦怛姪他塢禪婆上𠼐一禪婆上𠼐二奔入𡆆禪婆上犁三毗毗耶反跋低四莽莫古反𭢟曳五三摩提六摩訶三摩提七三摩鉢低八摩訶三摩鉢低九儞平犁十儞平犁十一儞平羅計世十二計始儞平十三矩隸十四矩隸十五摩訶矩隸十六儞平羅矩隸十七悉提十八悉陀摩怒𡆆梯十九遏𪘜二十跋𪘜二十一𭢟𪘜二十二拘𭢟𪘜二十三三漫低二十四婆羅矩制二十五憚低二十六儞平羅計世二十七矩隸二十八摩訶矩隸二十九尼羅建低三十常具梨三十一虎世三十二牟虎世三十三婆羅常具梨三十四叵羅矩制三十五叵羅悶制普三十六莎訶三十七爾時七山大藥叉軍將合掌恭敬白佛言世尊我今亦為擁護利益諸善男子善女人故說陀羅尼若復有人能受持此護命法門陀羅尼呪於晨朝時當起讀誦怛姪他阿麼犁一毗麼犁二儞儞逸反麼犁三瞢伽上例去四呬囉若尼也反揭鞞五薩婆阿喇他娑柁儞平六麼迦室者之可反儞平七庾訖低八毗囉逝九羯𪘜十計株吒拘反劍平婆上犁十一勃𡆆𠿒訶訖反迷十二勃𡆆𠿒訶訖反摩娑娑訖反嚩𠼐十三勃囉𠿒訶訖反摩悉提十四悉陀麼怒𡆆替普十五莎訶十六爾時金剛商羯羅大天女合掌恭敬白佛言世尊我今亦為擁護利益哀愍攝受諸善男子及善女人說陀羅尼句皆令安隱致諸吉祥若復有人能受持此法門護命神呪於晨朝時當起讀誦怛姪他跋折㘑一跋折𡆆二跋折㘑三摩訶跋折㘑四跋折囉麼底五勃陀跋折隸六勃陀